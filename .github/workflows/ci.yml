name: Frontend CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      # package.json 에 lint·build 스크립트가 없어 실제 있는 검사로 실행 (타입 검사 + 웹 번들 빌드)
      - name: Run typecheck
        run: npm run typecheck

      - name: Run build
        run: npx expo export --platform web --output-dir dist
